name: Register a team
description: Enter your bot in the competition.
title: "Register: "
labels: ["registration"]
body:
  - type: markdown
    attributes:
      value: |
        Open this from the competition site's **Register** page and it arrives
        filled in. You must be signed in as the GitHub account that **owns**
        the repository below; registrations from anyone else are rejected.
  - type: input
    id: team
    attributes:
      label: Team name
      description: Lowercase letters, digits, "-" and "_". Up to 32 characters.
      placeholder: team-fox
    validations:
      required: true
  - type: input
    id: repo
    attributes:
      label: Repository URL
      description: A public GitHub repository with bot.py at the top level.
      placeholder: https://github.com/your-name/your-bot
    validations:
      required: true
  - type: input
    id: branch
    attributes:
      label: Branch (optional)
      description: Leave empty to use the repository's default branch.
      placeholder: main
    validations:
      required: false
