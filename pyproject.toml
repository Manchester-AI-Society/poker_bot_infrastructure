[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "poker-player-sdk"
version = "0.1.0"
description = "Poker bot competition: write a PokerBot, pack it, enter it."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Manchester AI Society" }]
license = { text = "MIT" }
dependencies = [
    "cloudpickle==3.1.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["player_sdk*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 79
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = []

[tool.ruff.lint.per-file-ignores]
# Scripts bootstrap sys.path before importing repo packages.
"examples/*" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
