services:
  poker-server:
    build: .
    image: poker-bot-server
    ports:
      - "8000:8000"
    # Copy exampleenv to .env (or point env_file at your own file) to
    # configure BOT_API_KEYS / ADMIN_API_KEYS for this deployment.
    env_file:
      - .env
    restart: unless-stopped

  # Public HTTPS URL via an outbound Cloudflare quick tunnel (no account needed).
  # Works on networks that block inbound/peer traffic, e.g. eduroam.
  # Start with: docker compose --profile tunnel up --build -d
  tunnel:
    image: cloudflare/cloudflared:2024.12.2
    # http2 = TCP 443 only; the default QUIC (UDP 7844) is often blocked on campus Wi-Fi
    command: tunnel --no-autoupdate --protocol http2 --url http://poker-server:8000
    depends_on:
      - poker-server
    profiles: [tunnel]
    restart: unless-stopped
